services:
  init-permissions:
    image: hikage/docker-cubic-odyssey:latest
    user: root
    entrypoint: []
    command:
      - /bin/bash
      - -lc
      - |
        mkdir -p /home/cubic/server_files/config
        mkdir -p /home/cubic/server_files/server
        mkdir -p /home/cubic/backups
        mkdir -p /home/cubic/.steam
        chown -R cubic:cubic /home/cubic /home/cubic/server_files /home/cubic/backups /home/cubic/.steam
        chmod -R u+rwX /home/cubic/server_files /home/cubic/backups /home/cubic/.steam
    volumes:
      - cubic_server_files:/home/cubic/server_files
      - "C:\\Users\\hikag\\Documents\\Cubic-Test\\backups:/home/cubic/backups"

  cubic:
    image: hikage/docker-cubic-odyssey:latest
    init: true
    tty: true
    stdin_open: true
    stop_grace_period: 1m
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    environment:
      STEAM_USER: "${STEAM_USER}"
      STEAM_PASS: "${STEAM_PASS}"
      BACKUP_RETENTION: "10"
      BACKUP_CRON_SCHEDULE: "0 * * * *"
    ports:
      - "27001-27015:27001-27015/udp"
    volumes:
      - cubic_server_files:/home/cubic/server_files
      - "C:\\Users\\hikag\\Documents\\Cubic-Test\\backups:/home/cubic/backups"

volumes:
  cubic_server_files: